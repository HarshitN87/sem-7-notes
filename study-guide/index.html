<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Mid-Semester Almanac</title>
<meta name="description" content="A 55-second animated story: Almo the study mascot takes the study train through all five mid-sem exams. Created by Harshit.">
<style>
  :root{
    --bg:#170F1A; --bg2:#2A1D2C; --ink:#F4E7E3; --muted:#C4ADB9; --mat:#FBF1E6; --line:#8C6A7C; --acc:#E59AAE;
    --sys:"Segoe UI","Trebuchet MS",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0; min-height:100%}
  body{background:radial-gradient(120% 90% at 50% 0%, var(--bg2), var(--bg) 70%); color:var(--ink); font-family:var(--sys);
    padding-inline:16px; padding-block:18px 40px; display:flex; flex-direction:column; align-items:center}
  .kicker{font-size:12px; letter-spacing:.34em; text-transform:uppercase; color:var(--muted); text-align:center; margin:4px 0 14px}
  .kicker b{color:var(--acc); font-weight:600}
  .reel{--size:min(calc(100vw - 32px), calc(100vh - 210px), 820px); width:max(280px, var(--size)); max-width:100%}
  .mat{background:var(--mat); padding:10px; border-radius:6px; box-shadow:0 30px 60px -30px rgba(0,0,0,.8);
    outline:1px solid var(--line); outline-offset:5px; position:relative}
  canvas{display:block; width:100%; aspect-ratio:1/1; border-radius:3px; background:#2B2750; cursor:pointer}
  .end{position:absolute; inset:10px; display:grid; place-items:center; pointer-events:none}
  .end[hidden]{display:none}
  .end .box{pointer-events:auto; display:flex; flex-direction:column; gap:10px; align-items:center; transform:translateY(-30%)}
  .btn{font:inherit; font-size:13px; letter-spacing:.16em; text-transform:uppercase; cursor:pointer; border:0; text-decoration:none;
    padding:12px 20px; border-radius:999px; display:inline-flex; align-items:center; gap:8px}
  .btn-enter{background:#2C1D28; color:#FBF1E6; font-size:15px; padding:16px 26px; box-shadow:0 12px 26px -12px rgba(0,0,0,.7)}
  .btn-enter:hover{background:#5B3A6E}
  .btn-ghost{background:rgba(44,29,40,.72); color:#FBF1E6}
  .bar{display:grid; grid-template-columns:auto 1fr auto auto; gap:12px; align-items:center; margin-top:16px}
  .ctl{font:inherit; font-size:12px; letter-spacing:.14em; text-transform:uppercase; background:transparent; color:var(--ink);
    border:1px solid var(--line); padding:9px 14px; border-radius:999px; cursor:pointer; min-width:84px}
  .ctl:hover{border-color:var(--acc); color:var(--acc)}
  .scrub{position:relative; height:28px; cursor:pointer; touch-action:none; min-width:80px}
  .scrub .track{position:absolute; left:0; right:0; top:12px; height:4px; background:rgba(255,255,255,.14); border-radius:2px}
  .scrub .fill{position:absolute; left:0; top:12px; height:4px; width:0; background:var(--acc); border-radius:2px}
  .scrub .knob{position:absolute; top:7px; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:#FBF1E6; box-shadow:0 0 0 3px rgba(229,154,174,.35)}
  .scrub .tick{position:absolute; top:9px; width:2px; height:10px; background:rgba(255,255,255,.35)}
  .clock{font-variant-numeric:tabular-nums; font-size:13px; color:var(--muted); min-width:9ch; text-align:right}
  .skip{color:var(--ink); font-size:12px; letter-spacing:.14em; text-transform:uppercase; text-decoration:none; border-bottom:1px solid var(--acc); padding-bottom:2px; white-space:nowrap}
  .skip:hover{color:var(--acc)}
  .chapters{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:12px 0 0; padding:0; list-style:none}
  .chapters button{font:inherit; font-size:11.5px; letter-spacing:.08em; background:rgba(255,255,255,.05); color:var(--muted);
    border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:6px 11px; cursor:pointer}
  .chapters button[aria-current="true"]{background:var(--acc); color:#1C1420; border-color:var(--acc)}
  .chapters button .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px}
  details.transcript{margin-top:18px; max-width:62ch; color:var(--muted); font-size:14.5px; line-height:1.6}
  details.transcript summary{cursor:pointer; color:var(--ink); letter-spacing:.08em}
  details.transcript h3{font-size:14px; color:var(--ink); margin:14px 0 4px}
  details.transcript ul{margin:0; padding-left:18px}
  .credit{margin-top:22px; font-size:11.5px; letter-spacing:.3em; text-transform:uppercase; color:var(--muted)}
  .nogl{padding:28px; color:#2C1D28; text-align:center; font-size:15px}
  :focus-visible{outline:2px solid var(--acc); outline-offset:3px}
  @media (max-width:560px){
    .bar{grid-template-columns:auto 1fr auto; row-gap:10px}
    .skip{grid-column:1 / -1; justify-self:center}
    .kicker{letter-spacing:.2em}
  }
</style>
</head>
<body>
<div class="kicker"><b>The Mid-Semester Almanac</b> · a 55-second story</div>
<div class="reel">
  <div class="mat">
    <canvas id="film" role="img" aria-label="Animated story: Almo the study mascot is worried about five exams, catches a golden ticket, and rides a study train through one station per exam, collecting a book at each stop, until exam day. A text version is below the film."></canvas>
    <div class="end" id="end" hidden><div class="box">
      <a class="btn btn-enter" href="lobby.html">Enter the Almanac →</a>
      <button class="btn btn-ghost" id="again" type="button">↺ Watch again</button>
    </div></div>
  </div>
  <div class="bar">
    <button class="ctl" id="pp" type="button">Pause</button>
    <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Film position" aria-valuemin="0" aria-valuemax="55" aria-valuenow="0">
      <div class="track"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div>
    </div>
    <span class="clock" id="clock">0:00 / 0:55</span>
    <a class="skip" href="lobby.html">Skip intro →</a>
  </div>
  <ul class="chapters" id="chapters"></ul>
</div>
<details class="transcript" id="transcript"><summary>Read the story as text</summary></details>
<div class="credit">Created by Harshit</div>

<script>
(function(){
"use strict";

/* =====================================================================
   THE STORY
   mode 0 = the night before · 1 = the golden ticket · 2 = a train station · 3 = exam day
   ===================================================================== */
var ST = 7.0; // seconds per station
var SCENES = [
  {key:"The night before", mode:0, len:6.5, sky:["#241F46","#4A3D70"], acc:"#8E6BB8", acc2:"#5B3A6E",
   chip:"THE NIGHT BEFORE", title:"Almo has 5 exams in 8 days…",
   lines:["…and absolutely no idea where to start."], tip:""},
  {key:"The golden ticket", mode:1, len:5.5, sky:["#3A2E66","#8E6391"], acc:"#D9A441", acc2:"#5B3A6E",
   chip:"AND THEN…", title:"A golden ticket floats down!",
   lines:["The Mid-Semester Almanac: one stop per exam", "All aboard the study train!"], tip:""},
  {key:"RM & IPR", mode:2, len:ST, stop:0, icon:1, sky:["#F5D2DE","#FFF3EA"], acc:"#A83F63", acc2:"#6B2D5C",
   chip:"STOP 1 · SAT 26 SEPT · TRM-701", title:"Research Methodology & IPR",
   lines:["Unit 1 · Picking a good research problem","Unit 2 · Reading papers, plagiarism & ethics","Unit 3 · Writing reports & proposals"], tip:"Almo learns the 11 steps of research"},
  {key:"ACA", mode:2, len:ST, stop:1, icon:2, sky:["#D3E6F2","#FFF4EA"], acc:"#C0433A", acc2:"#2F6F95",
   chip:"STOP 2 · MON 28 SEPT · TCS-704", title:"Advanced Computer Architecture",
   lines:["Unit 1 · Moore's law, power, cost & chip yield","Unit 1 · Amdahl's law & the Iron Law","Unit 2 · Caches, coherence & virtual memory"], tip:"Almo practises the cache tag / index / offset sum"},
  {key:"MBA-302", mode:2, len:ST, stop:2, icon:3, sky:["#F3E3B3","#FFF6E6"], acc:"#A87A12", acc2:"#5E6B3A",
   chip:"STOP 3 · TUE 29 SEPT · MBA-302 · ALL MCQs", title:"Innovation & Venture Development",
   lines:["Unit I · Innovation & India's startup scene","Unit I · Startup India, design thinking, SCAMPER","Unit II · Lean startup & Business Model Canvas"], tip:"Almo tries all 84 practice MCQs"},
  {key:"BI", mode:2, len:ST, stop:3, icon:4, sky:["#CDECE7","#FFF3EA"], acc:"#23857C", acc2:"#C8703F",
   chip:"STOP 4 · WED 30 SEPT · TCS-726", title:"Business Intelligence",
   lines:["Unit 1 · IT in business & the Baldrige framework","Unit 2 · Structured vs unstructured data","Unit 3 · OLTP vs OLAP, cubes & warehouses"], tip:"Almo slices and dices a data cube"},
  {key:"LLMs", mode:2, len:ST, stop:4, icon:5, sky:["#F7D9C2","#FFF4EC"], acc:"#BD5A22", acc2:"#6E4A2F",
   chip:"STOP 5 · SAT 3 OCT · TCS-765", title:"Large Language Models",
   lines:["Unit 0 · Machine learning from zero","Unit 1 · Transformers, attention & training","Unit 2 · Chatbots, RAG, translation & summaries"], tip:"Almo learns softmax(QKᵀ / √d) · V"},
  {key:"Exam day", mode:3, len:8.0, sky:["#FFC9A8","#FFF1DC"], acc:"#5B3A6E", acc2:"#8E2F45",
   chip:"EXAM DAY", title:"Almo's ready. So are you!",
   lines:["Flashcards, model answers & expected papers inside","Study a little every day · Created by Harshit"], tip:""}
];
var DURATION = 0;
SCENES.forEach(function(s){ s.t0 = DURATION; DURATION += s.len; s.t1 = DURATION; });
var FIRST_STOP = 2, LAST_STOP = 6;

/* ---------------- transcript (also the no-WebGL fallback) ---------------- */
var tr = document.getElementById("transcript");
SCENES.forEach(function(s){
  var h = document.createElement("h3"); h.textContent = s.chip + " · " + s.title; tr.appendChild(h);
  var ul = document.createElement("ul");
  s.lines.concat(s.tip ? [s.tip] : []).forEach(function(l){ var li = document.createElement("li"); li.textContent = l; ul.appendChild(li); });
  tr.appendChild(ul);
});
document.getElementById("clock").textContent = "0:00 / " + fmt(DURATION);
function fmt(s){ s = Math.max(0, Math.floor(s + 1e-6)); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }
function hex(c){ return [parseInt(c.slice(1,3),16)/255, parseInt(c.slice(3,5),16)/255, parseInt(c.slice(5,7),16)/255]; }
function mix3(a, b, k){ return [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k]; }
function clamp01(x){ return Math.max(0, Math.min(1, x)); }
function easeOut(x){ x = clamp01(x); return 1 - Math.pow(1 - x, 3); }
function easeInOut(x){ x = clamp01(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; }

var canvas = document.getElementById("film");
var gl = canvas.getContext("webgl2", {antialias:false, premultipliedAlpha:false, alpha:false});
if (!gl){
  var box = document.createElement("div"); box.className = "nogl";
  box.textContent = "Your browser can't play this WebGL2 film, but the whole story is in \"Read the story as text\" below.";
  canvas.replaceWith(box); tr.open = true; document.querySelector(".bar").style.display = "none";
  return;
}

/* =====================================================================
   SHADER: everything is drawn with signed-distance shapes, no images
   ===================================================================== */
var VS = "#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
var FS = [
"#version 300 es",
"precision highp float;",
"out vec4 o;",
"uniform vec2 uRes; uniform float uT,uG,uMode,uIris,uCard,uMood,uJoy,uWave;",
"uniform float uCam,uSign,uSignPrev,uIcon,uIconPrev,uBooks,uStamp,uTicket,uSun;",
"uniform vec3 uSkyA,uSkyB,uAcc,uAcc2;",
"uniform sampler2D uText; uniform vec4 uLine[8];",
"const vec3 INK=vec3(.173,.114,.157); const vec3 CREAM=vec3(1.,.968,.93); const vec3 GOLD=vec3(1.,.8,.3);",
"float AA; float gS=1.;",
"float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}",
"mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}",
"float sdC(vec2 p,float r){return length(p)-r;}",
"float sdB(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}",
"float sdS(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h);}",
"float sdE(vec2 p,vec2 r){return (length(p/r)-1.)*min(r.x,r.y);}",
"float sdHex(vec2 p,float r){const vec3 k=vec3(-.866025404,.5,.577350269);p=abs(p);p-=2.*min(dot(k.xy,p),0.)*k.xy;p-=vec2(clamp(p.x,-k.z*r,k.z*r),r);return length(p)*sign(p.y);}",
"float sdStar(vec2 p,float r,float rf){const vec2 k1=vec2(.809016994375,-.587785252292);const vec2 k2=vec2(-k1.x,k1.y);p.x=abs(p.x);p-=2.*max(dot(k1,p),0.)*k1;p-=2.*max(dot(k2,p),0.)*k2;p.x=abs(p.x);p.y-=r;vec2 ba=rf*vec2(-k1.y,k1.x)-vec2(0,1);float h=clamp(dot(p,ba)/dot(ba,ba),0.,r);return length(p-ba*h)*sign(p.y*ba.x-p.x*ba.y);}",
"float cov(float d){float a=AA/gS;return 1.-smoothstep(-a,a,d);}",
"void put(inout vec3 c,vec3 k,float d){c=mix(c,k,cov(d));}",
"void putA(inout vec3 c,vec3 k,float d,float a){c=mix(c,k,cov(d)*a);}",
"void ink(inout vec3 c,vec3 k,float d,float w){put(c,INK,d-w);put(c,k,d);}",
"float eo(float x){x=clamp(x,0.,1.);return 1.-pow(1.-x,3.);}",
"vec3 BK(int i){ if(i==0)return vec3(.659,.247,.388); if(i==1)return vec3(.753,.263,.227); if(i==2)return vec3(.659,.478,.071); if(i==3)return vec3(.137,.522,.486); return vec3(.741,.353,.133);}",

/* ---- a book (used on the desk, the wagon and the final stack) ---- */
"void book(inout vec3 col,vec2 b,int i,float w){",
"  ink(col,BK(i),sdB(b,vec2(w,.0105),.003),.0035);",
"  put(col,vec3(1.,.97,.9),sdB(b-vec2(w-.012,0.),vec2(.007,.0065),.001));",
"  put(col,mix(BK(i),vec3(1.),.45),sdB(b+vec2(w*.3,0.),vec2(.012,.0025),.001));",
"}",

/* ---- Almo, drawn around his feet at the origin; s = scale ---- */
"void mascot(inout vec3 col,vec2 uv,float t,vec2 M,float s,float joy,float wave,float mood){",
"  gS=s; vec2 L=(uv-M)/s;",
"  float ph=abs(sin(t*3.4)); float hop=joy*ph/s;",
"  float sq=1.+.10*(1.-ph)*step(.001,joy);",
"  vec2 c=vec2(0.,-.072-hop); vec2 r=vec2(.078*sq,.070/sq);",
"  putA(col,INK,sdE(L-vec2(0.,.004),vec2(.07*(1.-hop*4.),.011)),.16);",
"  vec2 q=L-c;",
"  ink(col,vec3(1.,.9,.82),sdE(q-vec2(-.036,r.y-.006),vec2(.022,.012)),.004);",
"  ink(col,vec3(1.,.9,.82),sdE(q-vec2(.036,r.y-.006),vec2(.022,.012)),.004);",
"  float wa=wave*(.55+.45*sin(t*10.))-.35;",
"  vec2 a1=rot(-.9-wa)*(L-(c+vec2(.066,.008)));",
"  ink(col,CREAM,sdE(a1-vec2(.02,0.),vec2(.024,.011)),.004);",
"  vec2 a2=rot(.9+.12*sin(t*2.))*(L-(c+vec2(-.066,.008)));",
"  ink(col,CREAM,sdE(a2+vec2(.02,0.),vec2(.024,.011)),.004);",
"  ink(col,CREAM,sdE(q,r),.0045);",
"  putA(col,vec3(1.),sdE(q-vec2(-.028,-.032),vec2(.022,.013)),.6);",
"  float bl=step(fract(t*.31+.37),.045); float ey=mix(1.,.12,bl);",
"  for(int i=0;i<2;i++){float sd=float(i)*2.-1.; vec2 e=q-vec2(sd*.026,-.008);",
"    put(col,INK,sdE(e,vec2(.0088,.0115*ey)));",
"    putA(col,vec3(1.),sdC(e-vec2(-.003,-.004),.0032),1.-bl);",
"    putA(col,vec3(1.,.52,.58),sdE(q-vec2(sd*.048,.013),vec2(.013,.0075)),.55*mood);",
"    if(mood<.5) put(col,INK,sdS(q,vec2(sd*.014,-.030),vec2(sd*.036,-.023))-.0022); }",
"  vec2 m=q-vec2(0.,.014);",
"  if(mood>.5) put(col,INK,max(abs(length(m-vec2(0.,-.006))-.012)-.0024,-.006-m.y));",
"  else { put(col,INK,abs(sdE(m-vec2(0.,.004),vec2(.0075,.0058)))-.0022);",
"    vec2 dr=q-vec2(.07,-.045+.006*sin(t*5.)); put(col,vec3(.55,.8,1.),min(sdC(dr,.0085),sdS(dr,vec2(0.,-.004),vec2(0.,-.02))-.003)); }",
"  vec2 hc=c+vec2(0.,-r.y+.006); vec2 cq=L-hc;",
"  put(col,INK,sdB(cq-vec2(0.,.002),vec2(.032,.011),.004));",
"  put(col,INK,(abs(cq.x)/.066+abs(cq.y+.014)/.02-1.)*.019);",
"  putA(col,vec3(1.),(abs(cq.x)/.05+abs(cq.y+.016)/.012-1.)*.012,.12);",
"  float sw=.35*sin(t*4.2); vec2 tp=vec2(0.,-.014); vec2 te=tp+rot(sw)*vec2(.05,.028);",
"  put(col,uAcc,sdS(cq,tp,te)-.0017); put(col,uAcc,sdC(cq-te,.0065)); put(col,uAcc,sdC(cq-tp,.004));",
"  gS=1.;",
"}",

/* ---- the golden ticket ---- */
"void ticket(inout vec3 col,vec2 p,float glow){",
"  col+=GOLD*.5*glow*exp(-26.*length(p));",
"  float d=sdB(p,vec2(.05,.028),.006); d=max(d,-sdC(abs(p)-vec2(.05,0.),.009));",
"  ink(col,GOLD,d,.0035);",
"  putA(col,vec3(1.),abs(sdB(p,vec2(.04,.019),.004))-.0014,.8);",
"  vec2 sq=p; sq.y=-sq.y; put(col,INK,sdStar(sq,.012,.5));",
"}",

/* ---- subject props: id 1 magnifier, 2 chip, 3 bulb, 4 cube, 5 chat, 6 star ---- */
"void icon(inout vec3 col,vec2 p,float id,float t,float s){",
"  gS=s; p/=s;",
"  if(id<5.5){ put(col,vec3(1.),sdC(p,.118)); putA(col,uAcc,abs(sdC(p,.118))-.0035,.9); }",
"  if(id<1.5){",
"    vec2 d0=p-vec2(.022,-.012); ink(col,vec3(1.,.985,.96),sdB(d0,vec2(.046,.058),.006),.0035);",
"    for(int i=0;i<5;i++){float fi=float(i); put(col,mix(uAcc,vec3(1.),.55),sdB(d0-vec2(-.004+.006*mod(fi,2.),-.036+fi*.017),vec2(.03-.006*mod(fi,2.),.003),.002));}",
"    vec2 q=rot(.22*sin(t*1.7))*(p+vec2(.012,.004)); vec2 l=q+vec2(.014,.014);",
"    put(col,INK,sdS(q,vec2(.025,.025),vec2(.068,.068))-.013); put(col,uAcc2,sdS(q,vec2(.03,.03),vec2(.064,.064))-.009);",
"    put(col,INK,sdC(l,.052)); put(col,uAcc2,sdC(l,.047)); put(col,vec3(.86,.94,1.),sdC(l,.036));",
"    putA(col,vec3(1.),sdE(l+vec2(.014,.014),vec2(.012,.007)),.9);",
"  } else if(id<2.5){",
"    vec2 q=p; float pul=.5+.5*sin(t*3.);",
"    for(int k=0;k<2;k++){ vec2 pq=k==0?q:q.yx; float px=mod(pq.x+.011,.022)-.011;",
"      float pin=sdB(vec2(px,abs(pq.y)-.071),vec2(.0045,.012),.002); pin=max(pin,abs(pq.x)-.05); put(col,vec3(.62,.62,.66),pin); }",
"    ink(col,uAcc2,sdB(q,vec2(.058),.012),.004);",
"    put(col,mix(uAcc2,vec3(1.),.18),sdB(q,vec2(.048),.009));",
"    ink(col,mix(uAcc,vec3(1.),.25*pul),sdB(q,vec2(.028),.006),.003);",
"    col+=uAcc*.25*pul*exp(-60.*max(sdB(q,vec2(.028),.006),0.));",
"  } else if(id<3.5){",
"    vec2 q=p; float pul=.6+.4*sin(t*3.2);",
"    for(int k=0;k<8;k++){ float an=float(k)*.785398+t*.35; vec2 dr=vec2(cos(an),sin(an));",
"      putA(col,GOLD,sdS(q+vec2(0.,.012),dr*.066,dr*(.082+.008*pul))-.0035,.9); }",
"    col+=GOLD*.3*pul*exp(-18.*length(q+vec2(0.,.012)));",
"    ink(col,mix(vec3(1.,.94,.62),vec3(1.,.98,.85),pul),sdC(q+vec2(0.,.012),.047),.0045);",
"    putA(col,vec3(1.),sdE(q+vec2(.018,.03),vec2(.012,.008)),.8);",
"    put(col,uAcc,sdS(q,vec2(-.012,.008),vec2(-.004,-.006))-.002); put(col,uAcc,sdS(q,vec2(-.004,-.006),vec2(.004,.008))-.002); put(col,uAcc,sdS(q,vec2(.004,.008),vec2(.012,-.006))-.002);",
"    ink(col,vec3(1.,.95,.86),sdB(q-vec2(0.,.044),vec2(.022,.01),.004),.003);",
"    ink(col,vec3(.66,.66,.7),sdB(q-vec2(0.,.064),vec2(.019,.012),.005),.003);",
"  } else if(id<4.5){",
"    vec2 q=p-vec2(0.,.004); float R=.064; float dh=sdHex(q.yx,R*.866);",
"    put(col,INK,dh-.0045);",
"    vec3 fc; if(q.y< -.57735*abs(q.x)) fc=mix(uAcc,vec3(1.),.45); else if(q.x<0.) fc=uAcc; else fc=mix(uAcc,INK,.32);",

function compile(type, src){

  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
var prog = gl.createProgram();
try {
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));

  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
} catch (err) {
  console.error(err);
  var fb = document.createElement("div"); fb.className = "nogl";
  fb.textContent = "The film couldn't start on this device, but the whole story is in \"Read the story as text\" below.";
  canvas.replaceWith(fb); tr.open = true; document.querySelector(".bar").style.display = "none";

}

var lineBoxes = [], textFor = -1, textSize = 0;

function fit(txt, weight, size, maxW){
  var s = size;
  do { tx.font = weight + " " + Math.round(s) + "px " + FONT; if (tx.measureText(txt).width <= maxW) break; s *= 0.95; } while (s > size * 0.55);
  return s;
}
function roundRect(x, y, w, h, r){ tx.beginPath(); tx.moveTo(x + r, y); tx.arcTo(x + w, y, x + w, y + h, r); tx.arcTo(x + w, y + h, x, y + h, r); tx.arcTo(x, y + h, x, y, r); tx.arcTo(x, y, x + w, y, r); tx.closePath(); }
function drawText(si){
  var S = tc.width, sc = SCENES[si], acc = sc.acc, ink = "#2C1D28";
  tx.clearRect(0, 0, S, S); tx.textBaseline = "middle"; tx.textAlign = "center";
  lineBoxes = [];
  var maxW = S * 0.76;
  var cs = fit(sc.chip, "700", S * 0.021, maxW * 0.9);
  tx.font = "700 " + Math.round(cs) + "px " + FONT;
  if ("letterSpacing" in tx) tx.letterSpacing = Math.round(cs * 0.14) + "px";
  var cw = tx.measureText(sc.chip).width + cs * 2.4, cy = S * 0.588, chh = cs * 2.0;
  tx.fillStyle = sc.mode < 2 ? "#5B3A6E" : acc; roundRect(S / 2 - cw / 2, cy - chh / 2, cw, chh, chh / 2); tx.fill();
  tx.fillStyle = "#FFF9F2"; tx.fillText(sc.chip, S / 2 + cs * 0.07, cy + 1);
  if ("letterSpacing" in tx) tx.letterSpacing = "0px";
  lineBoxes.push([(cy - chh / 2 - 4) / S, (cy + chh / 2 + 4) / S]);
  var ts = fit(sc.title, "800", S * 0.05, maxW), ty = S * 0.652;
  tx.font = "800 " + Math.round(ts) + "px " + FONT; tx.fillStyle = ink; tx.fillText(sc.title, S / 2, ty);
  lineBoxes.push([(ty - ts * 0.72) / S, (ty + ts * 0.72) / S]);
  var n = sc.lines.length, top = S * 0.726, gap = n > 2 ? S * 0.052 : S * 0.058;
  sc.lines.forEach(function(line, i){
    var y = top + i * gap, parts = line.split(" · "), pre = parts.length > 1 && /^Unit /.test(parts[0]) ? parts.shift() + " · " : "", rest = parts.join(" · ");
    var bs = fit(pre + rest, "600", S * 0.03, maxW - S * 0.04);
    tx.font = "800 " + Math.round(bs) + "px " + FONT; var w1 = tx.measureText(pre).width;
    tx.font = (sc.mode < 2 || sc.mode === 3 ? "italic 500 " : "500 ") + Math.round(bs) + "px " + FONT; var w2 = tx.measureText(rest).width;
    var x0 = S / 2 - (w1 + w2) / 2 + (pre ? S * 0.014 : 0);
    if (pre){ tx.fillStyle = acc; tx.beginPath(); tx.arc(x0 - S * 0.022, y, S * 0.0075, 0, Math.PI * 2); tx.fill(); }
    tx.textAlign = "left";
    tx.font = "800 " + Math.round(bs) + "px " + FONT; tx.fillStyle = acc; tx.fillText(pre, x0, y);
    tx.font = (sc.mode < 2 || sc.mode === 3 ? "italic 500 " : "500 ") + Math.round(bs) + "px " + FONT; tx.fillStyle = ink; tx.fillText(rest, x0 + w1, y);
    tx.textAlign = "center";
    lineBoxes.push([(y - bs * 0.75) / S, (y + bs * 0.75) / S]);
  });
  if (sc.tip){
    var tsz = fit(sc.tip, "italic 500", S * 0.024, maxW), tpy = S * 0.893;
    tx.font = "italic 500 " + Math.round(tsz) + "px " + FONT; tx.fillStyle = "#7A6170"; tx.fillText("✦  " + sc.tip + "  ✦", S / 2, tpy);
    lineBoxes.push([(tpy - tsz * 0.8) / S, (tpy + tsz * 0.8) / S]);
  }
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tc);
}

function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var css = canvas.getBoundingClientRect().width || 600;
  var px = Math.max(320, Math.min(1800, Math.round(css * dpr)));
  if (canvas.width !== px){ canvas.width = canvas.height = px; }
  var ts = Math.min(2048, px);
  if (textSize !== ts){ tc.width = tc.height = ts; textSize = ts; textFor = -1; }
  gl.viewport(0, 0, canvas.width, canvas.height);
}

function play(v){ playing = v; if (v && T >= DURATION) T = 0; pp.textContent = v ? "Pause" : "Play"; last = performance.now(); if (v) endEl.hidden = true; }
function seek(t){ T = Math.max(0, Math.min(DURATION, t)); if (T < DURATION) endEl.hidden = true; }
pp.addEventListener("click", function(){ play(!playing); });
canvas.addEventListener("click", function(){ play(!playing); });
document.getElementById("again").addEventListener("click", function(){ seek(0); play(true); });
function scrubTo(e){ var r = scrub.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * DURATION); }
var dragging = false;
scrub.addEventListener("pointerdown", function(e){ dragging = true; scrub.setPointerCapture(e.pointerId); scrubTo(e); });
scrub.addEventListener("pointermove", function(e){ if (dragging) scrubTo(e); });
scrub.addEventListener("pointerup", function(){ dragging = false; });
scrub.addEventListener("keydown", function(e){
  if (e.key === "ArrowRight"){ seek(T + 5); e.preventDefault(); }
  if (e.key === "ArrowLeft"){ seek(T - 5); e.preventDefault(); }
});
document.addEventListener("keydown", function(e){
  if (e.target.closest && e.target.closest("button, a, summary, [role=slider]")) return;
  if (e.key === " " || e.key === "k"){ play(!playing); e.preventDefault(); }
  if (e.key === "ArrowRight") seek(T + 5);
  if (e.key === "ArrowLeft") seek(T - 5);
});

var lineBuf = new Float32Array(32);
function uni3(n, v){ gl.uniform3fv(U[n], v); }

/* everything the shader needs at film time T */
function render(){
  var si = 0; for (var i = 0; i < SCENES.length; i++) if (T >= SCENES[i].t0) si = i;
  var sc = SCENES[si], lt = T - sc.t0, len = sc.len;
  if (textFor !== si){ drawText(si); textFor = si; }

  /* iris: opens the film, and wipes into the train ride and into exam day */
  var iris = 1;
  if (si === 0) iris = easeOut(lt / 1.2);
  if (si === 1) iris = easeOut((len - lt) / 0.6);
  if (si === FIRST_STOP) iris = easeOut(lt / 0.7);
  if (si === LAST_STOP) iris = easeOut((len - lt) / 0.6);
  if (si === SCENES.length - 1) iris = easeOut(lt / 0.7);

  var skyA = hex(sc.sky[0]), skyB = hex(sc.sky[1]), acc = hex(sc.acc), acc2 = hex(sc.acc2);
  if (sc.mode === 2 && si > FIRST_STOP){
    var pv = SCENES[si - 1], k = easeInOut(lt / 1.3);
    skyA = mix3(hex(pv.sky[0]), skyA, k); skyB = mix3(hex(pv.sky[1]), skyB, k);
    acc = mix3(hex(pv.acc), acc, k); acc2 = mix3(hex(pv.acc2), acc2, k);
  }

  /* the train ride: the camera slides between stations, slowing in and pulling away */
  var cam = 0, moving = 0, stopIdx = 0;
  if (sc.mode === 2){
    stopIdx = sc.stop;
    if (lt < 1.3){ cam = stopIdx - 0.5 * (1 - easeOut(lt / 1.3)); moving = 1 - lt / 1.3; }
    else if (lt > len - 1.3){ var q = (lt - (len - 1.3)) / 1.3; cam = stopIdx + 0.5 * q * q * q; moving = q; }
    else cam = stopIdx;
  }
  var books = 0;
  if (sc.mode === 2) books = stopIdx + clamp01((lt - 2.0) / 0.8);
  if (sc.mode === 3) books = 5;

  /* Almo's mood: worried at night, delighted once he has the ticket */
  var mood = sc.mode === 0 ? 0 : sc.mode === 1 ? (lt > 3.1 ? 1 : 0) : 1;
  var joy = sc.mode === 0 ? 0.0 : sc.mode === 1 ? (lt > 3.1 ? 0.03 : 0.0) : sc.mode === 3 ? 0.05 : 0.02;
  var wave = sc.mode === 1 ? clamp01(1 - Math.abs(lt - 3.8) / 1.2) : sc.mode === 3 ? clamp01(1 - Math.abs(lt - 1.8) / 1.5) : moving;

  /* caption timing */
  var rv = sc.mode === 2 ? [1.0, 1.3, 1.9, 2.5, 3.1] : [0.5, 0.9, 1.9, 2.8];
  var tipAt = sc.mode === 2 ? 3.7 : 3.6;
  lineBuf.fill(0);
  for (var j = 0; j < lineBoxes.length && j < 8; j++){
    var at = j < rv.length && !(sc.tip && j === lineBoxes.length - 1) ? rv[j] : tipAt;
    if (sc.mode === 1 && j >= 2) at = 3.4 + (j - 2) * 0.8;
    lineBuf[j * 4] = lineBoxes[j][0]; lineBuf[j * 4 + 1] = lineBoxes[j][1]; lineBuf[j * 4 + 2] = easeOut((lt - at) / 0.5);
  }

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uT, lt); gl.uniform1f(U.uG, G); gl.uniform1f(U.uMode, sc.mode); gl.uniform1f(U.uIris, iris);
  gl.uniform1f(U.uCard, easeOut((lt - (sc.mode === 2 ? 0.7 : 0.2)) / 0.4));
  gl.uniform1f(U.uMood, mood); gl.uniform1f(U.uJoy, joy); gl.uniform1f(U.uWave, wave);
  gl.uniform1f(U.uCam, cam);
  gl.uniform1f(U.uSign, 0.74 + stopIdx - cam); gl.uniform1f(U.uSignPrev, stopIdx > 0 ? 0.74 + stopIdx - 1 - cam : -9);
  gl.uniform1f(U.uIcon, sc.icon || 1); gl.uniform1f(U.uIconPrev, si > FIRST_STOP ? SCENES[si - 1].icon : 1);
  gl.uniform1f(U.uBooks, books);
  gl.uniform1f(U.uStamp, sc.mode === 2 ? Math.max(0, lt - 1.55) : 0);
  gl.uniform1f(U.uTicket, sc.mode === 1 ? (lt - 0.4) / 2.8 : 0);
  gl.uniform1f(U.uSun, sc.mode === 3 ? 0.3 * (1 - easeOut(lt / 3)) : 0);
  uni3("uSkyA", skyA); uni3("uSkyB", skyB); uni3("uAcc", acc); uni3("uAcc2", acc2);
  gl.uniform4fv(U.uLine, lineBuf);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(U.uText, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  var f = T / DURATION * 100; fillEl.style.width = f + "%"; knob.style.left = f + "%";
  clock.textContent = fmt(T) + " / " + fmt(DURATION); scrub.setAttribute("aria-valuenow", Math.round(T));
  var cb = chapters.querySelectorAll("button"); for (var c = 0; c < cb.length; c++) cb[c].setAttribute("aria-current", c === si ? "true" : "false");
}
function frame(now){
  var dt = Math.min(0.1, (now - last) / 1000); last = now;
  G += dt;
  if (playing){ T += dt; if (T >= DURATION){ T = DURATION; playing = false; pp.textContent = "Play"; endEl.hidden = false; } }

}
window.__film = { seek:function(t){ seek(t); render(); }, pause:function(){ play(false); }, duration:DURATION };
resize();
play(playing);
requestAnimationFrame(frame);
})();
